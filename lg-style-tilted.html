<style id="lg-style-tilted">
/* Tile style: Tilted (classic LG ribbon) *//* Classic LG ribbon tiles for the Apps row only: tall, tilted, coloured
   from each app's icon; the tile in focus pops up, still tilted.
   Off automatically in App cards mode. Remove with: lg-tiles.sh remove */
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .wrap{padding-top:34px;padding-bottom:44px;margin-top:-28px;margin-bottom:-38px}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app{width:150px;height:250px;padding:0;margin-right:6px;border-radius:0;
  background:#3d4450;outline:0;text-align:center}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app>img,
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app>.mono{width:100px;height:100px;margin:52px auto 0;border-radius:10px}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app>.mono{line-height:100px}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app>.fold{margin:46px auto 0}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app>.nm{position:absolute;left:8px;right:8px;bottom:16px;margin:0;
  font-size:18px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app.lgl>.nm{color:#1b1b1b;text-shadow:none}
html[data-lgstyle="tilted"] #stage:not(.cards) .row.active[data-key="app"] .tile.app:not(.hidden):not(.folded){opacity:1}
/* The tilt and the pop (not while arranging, which moves tiles itself) */
html[data-lgstyle="tilted"] #stage:not(.cards):not(.arranging) .row[data-key="app"] .tile.app{
  -webkit-transform:skewX(-8deg);transform:skewX(-8deg);
  -webkit-transition:-webkit-transform .22s cubic-bezier(.3,1.6,.6,1),box-shadow .22s,opacity .12s;
  transition:transform .22s cubic-bezier(.3,1.6,.6,1),box-shadow .22s,opacity .12s}
html[data-lgstyle="tilted"] #stage:not(.cards):not(.arranging) .row[data-key="app"] .tile.app>img,
html[data-lgstyle="tilted"] #stage:not(.cards):not(.arranging) .row[data-key="app"] .tile.app>.mono,
html[data-lgstyle="tilted"] #stage:not(.cards):not(.arranging) .row[data-key="app"] .tile.app>.fold,
html[data-lgstyle="tilted"] #stage:not(.cards):not(.arranging) .row[data-key="app"] .tile.app>.nm{
  -webkit-transform:skewX(8deg);transform:skewX(8deg);
  -webkit-transition:-webkit-transform .22s cubic-bezier(.3,1.6,.6,1);transition:transform .22s cubic-bezier(.3,1.6,.6,1)}
html[data-lgstyle="tilted"] #stage:not(.cards):not(.arranging) .row[data-key="app"] .tile.app.focus{z-index:3;
  -webkit-transform:translateY(-6px) scale(1.14) skewX(-8deg);transform:translateY(-6px) scale(1.14) skewX(-8deg);
  box-shadow:0 10px 24px rgba(0,0,0,.6)}
/* Wide live tiles (Netflix, Prime Video): double width; with the apps'
   own trending/continue-watching pictures cycling inside when Glasshouse's
   Recommended switch is on and the TV reports them. */
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app.lgw{width:306px}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app.lgw>img{width:110px;height:110px;margin-top:48px}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app.lgv{overflow:hidden;background-color:#000}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app .lgp{position:absolute;left:-24px;right:-24px;top:0;bottom:0;
  background:#000 center/cover no-repeat;opacity:0;-webkit-transition:opacity 1s;transition:opacity 1s}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app .lgp.on{opacity:1}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app .lgs{position:absolute;left:0;right:0;bottom:0;height:140px;
  background:-webkit-linear-gradient(top,rgba(0,0,0,0),rgba(0,0,0,.85));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85))}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app.lgv>img{position:absolute;left:22px;top:14px;width:52px;height:52px;margin:0;border-radius:8px;z-index:1}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app.lgv>.nm{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);z-index:1;text-align:left;left:24px;right:24px;bottom:14px;font-size:16px;opacity:.85}
html[data-lgstyle="tilted"] #stage:not(.cards) .row[data-key="app"] .tile.app .lgt{position:absolute;left:24px;right:24px;bottom:38px;z-index:1;text-align:left;
  font-size:21px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-lgstyle="tilted"] #stage:not(.cards):not(.arranging) .row[data-key="app"] .tile.app>.lgt,
html[data-lgstyle="tilted"] #stage:not(.cards):not(.arranging) .row[data-key="app"] .tile.app>.lgp{-webkit-transform:skewX(8deg);transform:skewX(8deg)}
</style>
